linux_display_server wayland
wayland_titlebar_color background

font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12
background_opacity 0.6

# window settings
initial_window_width 95c
initial_window_height 35c
window_padding_width 20
confirm_os_window_close 0

# Hyrule forest colors {{{

# Special
background #0a1f1b
foreground #dfe8c4

# Black
color0 #0e2a25
color8 #4d6b55

# Red
color1 #e0565f
color9 #ff7a7f

# Green
color2  #9aca68
color10 #c8df7c

# Yellow
color3  #e6ad5c
color11 #f2cf86

# Blue
color4  #6aa9d0
color12 #8cc4e3

# Magenta
color5  #d58aa6
color13 #e8a7c0

# Cyan
color6  #7cc8b4
color14 #a3e0cf

# White
color7  #c9d4b4
color15 #eef3d6

# Cursor
cursor #c8df7c
cursor_text_color #0a1f1b

# Selection highlight
selection_foreground #eef3d6
selection_background #29543d


# The color for highlighting URLs on mouse-over
url_color #7cc8b4

# Window borders
active_border_color #9aca68
inactive_border_color #0c2a27
bell_border_color #e6ad5c

# Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #c8df7c
active_tab_background   #0e372e
active_tab_font_style   bold
inactive_tab_foreground #669b62
inactive_tab_background #0a1f1b
inactive_tab_font_style bold
tab_bar_background #091d1a

# Title bar
macos_titlebar_color #0e372e

# {{{ Keybindings
map kitty_mod+t     new_tab_with_cwd
# }}

#https://github.com/Davi-K-Silva/dotfiles/blob/hyprland-work/config-in-dot/kitty/kitty.conf